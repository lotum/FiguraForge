[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "figuraforge"
version = "0.1.0"
description = "Reference images to printable, organically separated character parts"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1",
 "pydantic>=2.10,<3", "numpy>=2.0,<3", "scipy>=1.14,<2",
 "trimesh>=4.6,<5", "shapely>=2.1,<3", "pillow>=11,<13",
 "vtk>=9.3,<10", "scikit-image>=0.24,<1", "httpx>=0.27,<1", "cryptography>=44,<47"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "playwright>=1.49,<2", "lxml>=5,<7"]
[tool.setuptools.packages.find]
where = ["backend"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-ra"
