name: Test geometry and API contracts
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libxrender1 libsm6 libgomp1
      - run: python -m pip install -c requirements-tested.txt -e '.[dev]'
      - run: python -m pytest -W error --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
# All providers are mocked. CI never spends API credits.
